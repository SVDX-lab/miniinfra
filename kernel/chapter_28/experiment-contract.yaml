# 第 28 期实验合同：MoE 算子——路由与分组 GEMM

question: >
  MoE 把"一个大 GEMM"换成"路由 + 多个小 GEMM"：分组 GEMM 路径（sort/gather/
  分桶/scatter）与"逐 token 全量专家再筛选"朴素路径在同一权重同输入下能否对上
  （FP64 机器精度）？路由（gate/topk/sort/gather/scatter）各段开销占总时长比例
  多少（tokens ∈ {1,8,64,256,2048} × experts {8,64} × top-k {2,6,8} 矩阵）——
  小 batch 下路由开销是否吃掉全部收益？负载不均（80% token 集中 20% 专家的
  Zipf 构造）对延迟影响多大（专家桶最大深度 = 串行长度口径）？激活参数估算流程
  （附录 B 题 11）能否用公开 config 复核 V4-Pro 1.6T/49B 量级？"省计算不省权重
  读取"的字节数推导与 cache 模拟口径下，激活/触碰专家权重的比值随 batch 如何变化？

hypothesis: >
  ①分组 vs 朴素：FP64 rel ~1e-15（机器精度，结合律差）、FP32 ~1e-6 级；
  ②小 batch（tokens≤8）：路由+sort/scatter 等小算子在 CPU eager 下被 dispatch
  开销主导，路由占比高（>50% 量级），且分组路径相对等价容量单体 GEMM 慢
  （分组化代价 > 收益）；tokens=2048 时专家 GEMM 占比主导、路由占比降到
  ~10% 以下；③负载不均：专家桶最大深度 ≈ 均匀时 max_depth 的数倍，
  专家 GEMM 段（线程并行关键路径 = 最深桶）延迟随之上升，路由段不变；
  ④激活参数 ≈ 共享部分 + top-k×单专家参数，用 V2-Lite/Qwen3-30B/V3 公开
  config 复核 15.7B/2.4B、30.5B/3.3B、671B/37B 后再校 V4-Pro 1.6T/49B；
  ⑤权重读取：batch=1 只读 k/E 池字节（但随机散布），batch≥~10（E=64,k=6）
  触碰专家过半 → 读字节 ≈ 全池（省计算不省权重读取）；倾斜分布 + cache 模拟
  下 miss 字节显著低于均匀（热专家驻留）。

baseline: >
  "逐 token 走全量专家再筛选"朴素参考（同权重：E 个专家对同一批 x 各算一遍
  [E,N,d]，再按路由分数降序加权求和）；等价容量单体大 GEMM（dense FFN，
  intermediate = k×d_ff，与专家段同 FLOPs）作为分组化代价的分母。

variant: >
  单变量扫描：tokens ∈ {1,8,64,256,2048}；experts ∈ {8,64}；top-k ∈ {2,6,8}
  （k=8 且 E=8 为退化情形 top-k=E，声明后保留）；负载分布 ∈ {均匀,
  80/20-Zipf 倾斜}；dtype ∈ {FP64 代数锚点, FP32 主链}；top-k 权重归一化
  ∈ {norm=true（Qwen3 口径，主链）, norm=false（V2-Lite 口径变体）}。

invariants:
  config: 公开 MoE config（Qwen3-30B-A3B / DeepSeek-V2-Lite / Mixtral-8x7B /
    DeepSeek-V3）+ 扫描矩阵统一 FFN 维（V2-Lite d_ff=1408 口径，SYNTHETIC 声明）
  config_source:
    qwen3_moe: https://huggingface.co/Qwen/Qwen3-30B-A3B-Instruct-2507/blob/main/config.json
      （hidden_size=2048, moe_intermediate_size=768, num_experts=128,
      num_experts_per_tok=8, norm_topk_prob=true, decoder_sparse_step=1,
      mlp_only_layers=[]；抓取 2026-11-21）
    ds_v2_lite: https://huggingface.co/deepseek-ai/DeepSeek-V2-Lite/blob/main/config.json
      （hidden_size=2048, moe_intermediate_size=1408, n_routed_experts=64,
      num_experts_per_tok=6, n_shared_experts=2, first_k_dense_replace=1,
      norm_topk_prob=false, topk_method=greedy；抓取 2026-11-21）
    mixtral_8x7b: https://huggingface.co/mistralai/Mixtral-8x7B-v0.1/blob/main/config.json
      （hidden_size=4096, num_local_experts=8, num_experts_per_tok=2,
      intermediate_size=14336；抓取 2026-11-21）
    ds_v3: https://huggingface.co/deepseek-ai/DeepSeek-V3/blob/main/config.json
      （hidden_size=7168, moe_intermediate_size=2048, n_routed_experts=256,
      num_experts_per_tok=8, n_shared_experts=1, first_k_dense_replace=3,
      routed_scaling_factor=2.5；抓取 2026-11-21）
    v4_pro: 公开报道口径 1.6T 总参 / 49B 激活（大纲附录 B 题 11 给定，
      无官方 config——只做估算流程校核并显式声明假设）
    published_param_counts: DeepSeek-V2-Lite 15.7B/2.4B、Qwen3-30B-A3B
      30.5B/3.3B、DeepSeek-V3 671B/37B、Mixtral-8x7B 46.7B/12.9B
      （各自官方模型卡/技术报告公开数字，用于估算流程校核）
  config_values:
    scan_d_model: 2048          # 两个主公开 config 公共值
    scan_d_ff: 1408             # V2-Lite moe_intermediate_size（SYNTHETIC：E=8 列也用它）
    scan_experts: [8, 64]       # E=8 = Mixtral 结构锚点；E=64 = V2-Lite
    scan_topk: [2, 6, 8]        # k=2 Mixtral / k=6 V2-Lite / k=8 Qwen3-V3
  synthetic_declarations:
    - "扫描矩阵 d_ff=1408 不随 E 变化（单变量原则；Mixtral 真实 d_ff=14336/
       d_model=4096，仅取其 E=8/k=2 结构锚点）"
    - "专家 FFN = silu(x@Wg^T)⊙(x@Wu^T)@Wd^T，无 bias（主流 MoE 口径）；
       路由 = softmax + top-k + norm（Qwen3 口径主链）；V2-Lite 的 sigmoid
       scoring/greedy/noaux_tc 与 routed_scaling_factor 不在参考实现内
       （声明为变体差异，norm=false 变体覆盖其权重口径）"
    - "共享专家（V2-Lite n_shared=2 / V3 n_shared=1）在延迟实验中不建模
       （常量 GEMM，对路由开销占比为常数偏移），在参数估算中计入"
    - "负载不均 = 构造路由器（planted：80% token top-1 落 20% 热集，
       热集内 Zipf(α=1)）——合成设定声明，非真实流量"
    - "k=8 且 E=8 为退化情形（top-k=E：每 token 全专家，dense-equivalent
       软混合），保留并标注"
  weights: 合成权重 torch.randn 固定 seed × He 缩放（fan_in=收缩维：W_gate/
    W_up 用 d_model，W_down 用 d_ff——ep26 修正法）；路由矩阵独立 seed
  truth_dtype: FP64（CPU 朴素路径，代数锚点）+ FP32（CPU 主链，真值锚点）
  performance_dtype: FP32（CPU 列主口径）
  fixtures_seed_base: 20260329
  fixtures: correctness.npz（5 组 case：tiny/mid/mid-zipf/tie-break/real-dims，
    朴素路径 FP32/FP64 输出 + 路由选择 + 桶结构真值；权重与 x 按 seed 重建
    不进 npz）+ manifest.json 逐张量 SHA256
  correctness_shapes: tiny(d=32,E=8,k=2,N=16) / mid(d=64,E=16,k=6,N=64) /
    mid-zipf(同 mid) / tie-break(全同分数) / real-dims(V2-Lite E=64,d=2048,
    d_ff=1408,k=6,N=4)
  benchmark_shapes: tokens ∈ {1,8,64,256,2048} × experts ∈ {8,64} × topk ∈
    {2,6,8}（主链 FP32）；负载不均 E=64,k=6,tokens ∈ {64,256,2048}
  timing: ch01 口径（OperatorTimer P50/P95，CPU perf_counter）；warmup=2
    repeats=5（tokens=2048 大格 warmup=1 repeats=3 并在结果标注）；
    分段计时 = 单遍 profiled pass 多次取均值 + e2e 独立测
  memory_accounting: 整数字节核算（单专家 = 3×d×d_ff×dtype_bytes；激活 =
    k×单专家；触碰专家数 = 批内 distinct top-k 并集）；cache 模拟口径显式
    声明（块 = 整专家权重连续区、LRU、无预取、容量按专家数计）
  determinism: 无 atomics（CPU index_add 顺序确定）；路由 stable tie-break
    （分数相等 → 专家索引小者胜出）；3 次连跑位级一致
  platform_peaks_denominator: CPU 列只报 wall-clock 与结构口径（串行深度 =
    最深桶）；GPU 列回填时用 ch02 峰值
  out_of_scope: 训练侧（aux loss/容量因子丢 token）、CUDA/MUSA 自定义核
    （CUDA 待回填 4090 抢修；MUSA 可选列 = torch_musa eager）、专家并行
    通信（DeepEP 归番外/第 30 期生态行，本期限纸面注记）
