chapter: "09"
title: 镜像冷启动
status: implemented
question: |
  冷启动的时间花在哪里？
hypothesis: |
  冷启动时间主要花在镜像准备（拉取）段；节点预拉取/缓存命中时该段趋近于零，
  创建到可用的总延迟显著下降。若两组总延迟接近或分段计量不支持该结论，则假设不成立。
baseline: |
  冷镜像：每次请求前删除镜像并重新拉取（低复用访问模式的等价物）。
variable: |
  节点预拉取/缓存：镜像已在本地（高复用访问模式），准备段为零。
fixed:
  image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
  （专用牺牲镜像：其他章节不使用，rmi 不影响共享缓存）
  运行参数: docker run -d … sleep infinity + 首条 echo（与主线一致的受约束容器）
  段定义: |
    queue   = 请求被接受到开始准备（本实验单线程，恒为 ~0，如实记录）
    pull    = 镜像准备（冷=拉取缺失镜像；暖=缓存命中跳过）
    run     = 容器创建+启动（docker run -d 返回）
    ready   = 首条健康命令（docker exec echo ok）完成
correctness_checks:
  - 每次迭代的分段与总延迟逐条记录，冷/暖不混报
  - 冷组每次迭代镜像确实被删除重建（记录 rmi→pull 序列）
  - 暖组镜像 digest 全程不变（内容一致）
performance_metrics:
  - 冷（5 次）vs 暖（10 次）的 pull/run/ready/total P50/P95
  - 镜像体积（docker image inspect）
fault_inclusion: 无（本期变量是访问模式，不是故障）
exclusions:
  - 不模拟多节点镜像分发/P2P（单机课程）
  - 不测 registry 镜像（docker hub 外网延迟如实计入冷组）
known_risks:
  - 冷组依赖外网到 Docker Hub 的实时延迟，数字仅适用本机当时网络
