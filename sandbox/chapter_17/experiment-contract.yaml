chapter: "17"
title: 综合验收
status: implemented
question: |
  如何判断系统是否可用？
hypothesis: |
  组合此前机制的小系统在三类负载下满足设定的 SLO（短命令 P95<1500ms、
  语义正确率≥99%、状态连续 100%、批量有效样本率达标），
  六项故障注入后全部可解释/可恢复且资源归零。若任一 SLO 不达标或故障后残留，则假设不成立。
baseline: |
  裸系统（S0：固定宽松配额、无 TTL、缓冲输出、无 journal）。
variable: |
  综合系统 = S0 + 逐步打开：S1 配额 → S2 流式限额 → S3 TTL 释放/恢复 → S4 journal 幂等。
  阶段扫描记录 W1（短命令）每步的延迟/成功率变化；最终系统跑三类负载 + 故障注入。
fixed:
  image: alpine:3.19@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1
  负载: |
    W1 短代码执行：echo + 1MiB 哈希 ×12
    W2 长状态会话：写文件→后台服务→过 TTL→恢复读→进程不恢复断言
    W3 批量评测：8 题确定性 rollout（并行 4，含 1 网络违规题、1 答案泄漏题）
  SLO: |
    L1 短命令 P95 < 1500ms（W1，最终系统）
    L2 语义正确率 ≥ 99%（全部命令结果正确）
    L3 W2 状态连续率 100%
    L4 W3 有效样本 ≥ 6/8 且违规/泄漏被检出
    L5 六项故障全部可解释、可恢复、资源归零
fault_injection:
  - F1 控制面 kill -9 重启（journal 恢复状态视图）
  - F2 执行容器被外部杀死（下次命令透明重建）
  - F3 断网（结构性：全程 network none，注入越权请求验证被拒）
  - F4 磁盘配额（ulimit -f 文件大小上限 → 写满即失败，服务不崩）
  - F5 输出洪泛（32MiB 定长 → 流式限额内存有界）
  - F6 用户取消（执行中 stop → 树清理、零残留）
exclusions:
  - 不新增隔离原语（大纲）；调度用单 worker 内并发，不做放置扫描（第 12 期已测）
  - 成本账本用近似口径（墙钟×容器数、每类负载墙钟），非 cgroup 精确积分
known_risks:
  - WSL2 波动影响 L1；SLO 阈值按本机校准，跨机需重标定
