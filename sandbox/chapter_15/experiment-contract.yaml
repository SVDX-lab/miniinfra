chapter: "15"
title: 训练 rollout 与评测
status: implemented
question: |
  如何服务训练与评测？
hypothesis: |
  用固定配置（题目、镜像 digest、录制轨迹、种子、奖励器）批量创建的 rollout
  与单个按需会话产出完全一致的轨迹/奖励；答案与评测器在控制面，
  Agent 工作区不可见；隐藏答案残留与越权网络访问能被检测并判无效样本。
  若两次运行奖励不一致或作弊注入未被发现，则假设不成立。
baseline: |
  单个普通会话：逐题按需 create→轨迹→stop。
variable: |
  固定配置批量创建的 rollout 批次（并行 4）。
fixed:
  image: alpine:3.19@sha256:6baf43584bcb78f2e5847d1de515f23499913ac9f12bdf834811a3145eb11ca1
  题目集: 6 题（确定性命令轨迹，题目文件写入工作区）
  奖励器: 控制面比对导出产物内容 + 工作区完整性扫描（文件清单与允许集合比对）
  网络策略: 沙箱 network none（轨迹中含一次越权 wget 请求，预期失败并被判违规）
correctness_checks:
  - 批量两次运行：逐题轨迹哈希与奖励完全一致（可复现）
  - 单会话与批量：奖励一致
  - 答案/评测器不在 Agent 工作区（扫描干净）
  - 越权网络访问（wget example.invalid）被检测，样本判无效
  - 隐藏答案残留（预置答案文件）被完整性扫描检出，样本判无效
  - 有效样本的奖励与其期望值一致
performance_metrics:
  - 创建吞吐（批量并行 vs 单个顺序，会话/秒）
  - 每题完成时间分布（批量的 P95/尾部 vs 单个）
  - 每有效样本成本（总墙钟 / 有效样本数）
fault_injection:
  - 轨迹中注入越权网络命令
  - 工作区预置隐藏答案
exclusions:
  - 不做真实 RL 算法/在线模型（代理脚本回放轨迹）
  - 不做分布式 rollout 收集器
known_risks:
  - 并行度 4 下的时间数字受本机容器启动成本影响
